<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 60"
     fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    MHL monogram — Michael H. Loechel
    Letters share strokes: M right leg = H left leg, H right leg = L vertical
    Path: M4 52V8L26 34 48 8V52  (M)
          M48 30H98               (H crossbar)
          M98 8V52H140            (L)
    Usage: set stroke="currentColor" and control color via CSS, or set stroke directly.
    Variants below — use whichever fits the background.
  -->

  <!-- White on dark (primary) -->
  <g transform="translate(0, 0)">
    <rect x="-4" y="-4" width="198" height="68" fill="#08090E" rx="2"/>
    <path d="M4 52V8L26 34 48 8V52M48 30H98M98 8V52H140" stroke="#ffffff"/>
  </g>

  <!-- Tangerine on dark (accent) -->
  <g transform="translate(0, 80)">
    <rect x="-4" y="76" width="198" height="68" fill="#08090E" rx="2"/>
    <path d="M4 132V88L26 114 48 88V132M48 110H98M98 88V132H140" stroke="#EA8040"/>
  </g>

  <!-- Dark on white (light backgrounds) -->
  <g transform="translate(0, 160)">
    <rect x="-4" y="156" width="198" height="68" fill="#ffffff" rx="2"/>
    <path d="M4 212V168L26 194 48 168V212M48 190H98M98 168V212H140" stroke="#08090E"/>
  </g>

</svg>
