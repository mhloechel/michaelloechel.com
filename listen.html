<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Listen to Michael H. Loechel on Tidal, Spotify, Apple Music, YouTube Music, Amazon Music, Deezer, and Qobuz.">
  <title>Michael H. Loechel — Listen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100&family=DM+Sans:wght@300&family=DM+Mono:wght@300&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      background: #08090E;
      color: #E6E1D7;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; }
    .wrap {
      width: 100%;
      max-width: 420px;
      padding: 64px 28px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .photo {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #1E2138;
      margin-bottom: 22px;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 20%;
      filter: grayscale(0.55) contrast(1.08) brightness(0.9);
    }
    h1 {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-style: normal;
      font-size: 26px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .tag {
      font-size: 14px;
      color: #9AA1BC;
      max-width: 32ch;
      margin-bottom: 36px;
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      border: 1px solid #1E2138;
      border-radius: 2px;
      color: #E6E1D7;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      transition: border-color 0.18s, color 0.18s;
    }
    .links a:hover {
      border-color: #EA8040;
      color: #EA8040;
    }
    .mark {
      width: 72px;
      height: 30px;
      color: #7A7E96;
      margin-top: 44px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="photo">
      <img src="assets/portrait.jpg" alt="Michael H. Loechel">
    </div>

    <h1>Michael H. Loechel</h1>

    <p class="tag">
      Lo-Fi Jazz, Ambient, Electronic, Techno, World<br>
      — many moods, no boundaries.
    </p>

    <div class="links">
      <a href="https://open.spotify.com/artist/2Js5HXSsokuLLdqwQyaP4l" target="_blank" rel="noopener">SPOTIFY</a>
      <a href="https://music.apple.com/us/artist/michael-h-loechel/6803245976" target="_blank" rel="noopener">APPLE MUSIC</a>
      <a href="https://tidal.com/artist/84668411" target="_blank" rel="noopener">TIDAL</a>
      <a href="https://music.youtube.com/channel/UCzE_lzc34btvBPqri-1EB7w" target="_blank" rel="noopener">YOUTUBE MUSIC</a>
      <a href="https://music.amazon.com/artists/B0HFTSKB4N/michael-h-loechel" target="_blank" rel="noopener">AMAZON MUSIC</a>
      <a href="https://www.deezer.com/us/artist/411321802" target="_blank" rel="noopener">DEEZER</a>
      <a href="https://open.qobuz.com/artist/35263608" target="_blank" rel="noopener">QOBUZ</a>
    </div>

    <svg class="mark" viewBox="0 0 190 60"
         fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linejoin="round" stroke-linecap="round" aria-label="MHL">
      <path d="M4 52V8L26 34 48 8V52M48 30H98M98 8V52H140"/>
    </svg>

  </div>
</body>
</html>
